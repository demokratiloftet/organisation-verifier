name: demokratiloftet-verification
services:
  pds:
    build: .
    image: loftet-verification-pds:node-24.22.1
    container_name: public-verification-pds
    user: '1000:1000'
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,nosuid,nodev,size=32m']
    env_file: /root/organisation-verifier/.runtime/public-pds.env
    environment:
      PDS_HOSTNAME: pds.verifikasjon.demokratiloftet.no
      PDS_SERVICE_HANDLE_DOMAINS: .demokratiloftet.no
      PDS_PORT: '3000'
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blobs
      PDS_DID_PLC_URL: https://plc.directory
      PDS_CRAWLERS: https://bsky.network
      PDS_INVITE_REQUIRED: 'true'
      PDS_ACCEPTING_REPO_IMPORTS: 'false'
      PDS_DEV_MODE: 'false'
      PDS_DISABLE_SSRF_PROTECTION: 'false'
      PDS_RATE_LIMITS_ENABLED: 'true'
      LOG_LEVEL: warn
    volumes: ['/root/organisation-verifier/.runtime/public-pds-data:/pds']
    networks:
      backend: { ipv4_address: 10.249.98.2 }
      egress: { gw_priority: 1 }
    labels:
      traefik.enable: 'true'
      # Existing private Traefik only obtains/renews the DNS-01 certificate.
      traefik.http.routers.verification-certificate.rule: Host(`verifikasjon.demokratiloftet.no`) || Host(`pds.verifikasjon.demokratiloftet.no`)
      traefik.http.routers.verification-certificate.entrypoints: websecure
      traefik.http.routers.verification-certificate.service: noop@internal
      traefik.http.routers.verification-certificate.tls.certresolver: letsencrypt
      traefik.http.routers.verification-certificate.tls.domains[0].main: verifikasjon.demokratiloftet.no
      traefik.http.routers.verification-certificate.tls.domains[0].sans: pds.verifikasjon.demokratiloftet.no
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/xrpc/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  backend:
    name: verification-pds_backend
    internal: true
    ipam:
      config: [{ subnet: 10.249.98.0/24 }]
  egress: {}
