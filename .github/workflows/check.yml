name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        run: bash .github/scripts/scan-secrets.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm --dir fixture install --frozen-lockfile
      - run: pnpm --dir fixture typecheck
      - run: pnpm --dir fixture audit --audit-level=moderate
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm demo:up
      - run: pnpm test:integration
      - run: pnpm test:isolation
      - if: always()
        run: docker compose down
  deploy:
    name: Deploy demo
    needs: check
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && vars.DEMO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy checked commit through restricted SSH command
        env:
          GH_READ_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.DEMO_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEMO_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEMO_DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          deploy_tmp=$(mktemp -d)
          trap 'rm -rf "$deploy_tmp"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_tmp/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_tmp/known_hosts"
          printf '%s\n' "$GH_READ_TOKEN" | ssh -F /dev/null -i "$deploy_tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_tmp/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "root@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
